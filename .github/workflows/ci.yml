name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npm run test:ci
      - run: npm run build -- --configuration production

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://healthcare:healthcare@localhost:5432/healthcare_dashboard_test
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"
      - run: npm run build
      - run: npm test
