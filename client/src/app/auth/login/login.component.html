<main class="auth-page">
  <mat-card class="auth-card">
    <h1>Healthcare Dashboard</h1>
    <p class="muted">Sign in to continue</p>

    <p class="form-error" *ngIf="sessionExpired && !errorMessage" role="alert">
      Your session has expired. Please sign in again.
    </p>
    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" required />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        <mat-error>Password is required</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-footer">Need an account? <a routerLink="/register">Request access</a></p>
  </mat-card>
</main>
