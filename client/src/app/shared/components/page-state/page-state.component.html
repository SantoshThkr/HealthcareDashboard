<div class="page-state" *ngIf="state !== 'loaded'" [ngSwitch]="state" role="status">
  <ng-container *ngSwitchCase="'loading'">
    <mat-spinner diameter="32" aria-hidden="true"></mat-spinner>
    <p>{{ loadingText }}</p>
  </ng-container>

  <p *ngSwitchCase="'empty'" class="muted">{{ emptyText }}</p>

  <ng-container *ngSwitchCase="'error'">
    <p class="error-text">{{ errorText }}</p>
    <button mat-stroked-button type="button" (click)="retry.emit()">Try again</button>
  </ng-container>
</div>
